name: Publish Android release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Derive version from tag
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          MAJOR=${MAJOR:-0}; MINOR=${MINOR:-0}; PATCH=${PATCH:-0}
          CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: gradle test -PappVersion="${{ steps.version.outputs.name }}" -PappVersionCode="${{ steps.version.outputs.code }}"

      - name: Build APK
        run: gradle assembleDebug -PappVersion="${{ steps.version.outputs.name }}" -PappVersionCode="${{ steps.version.outputs.code }}"

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: DMs Only v${{ steps.version.outputs.name }}
          generate_release_notes: true
          files: app/build/outputs/apk/debug/app-debug.apk
